<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采购入库单签字｜供应链数据清洗</title><link rel="stylesheet" href="styles-merge14.css"><style>main{max-width:1280px;margin:30px auto;padding:20px}section{background:var(--surface,#fff);padding:24px;border:1px solid #d9dee7;border-radius:14px;margin:18px 0}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center}label{display:flex;flex-direction:column;gap:8px}button,input,select{font:inherit}button{padding:10px 18px;cursor:pointer}#preview{display:block;width:100%;height:auto;background:white;cursor:crosshair;border:1px solid #ccd3df}#status{white-space:pre-wrap;line-height:1.8}small{display:block;line-height:1.7;color:#5b6679}button:disabled{cursor:not-allowed;opacity:.5}</style></head><body><main><a href="index.html">← 返回工具箱</a><h1>采购入库单签字</h1><p>上传采购入库单后自动使用固定签名，在空白处签字并下载 PDF。原文件不修改，单据仅在当前浏览器内处理。</p><section><div class="controls"><label>采购入库单（可多选）<input id="file" disabled type="file" multiple accept=".xls,.xlsx"></label><label>查看工作表<select id="sheet" disabled></select></label><label>签名宽度（毫米）<input id="signatureWidth" type="number" min="15" max="70" value="35"></label></div><small>上传后自动签字。签名默认放在表格下方空白处，点击纸张空白位置可移动，位置按工作表分别保存。</small><p id="status" role="status">请上传采购入库单，上传后自动签字。</p><button id="download" disabled>下载签字 PDF</button></section><section><small>A4 竖向，按上传文件及工作表顺序合并为一个 PDF，每个工作表一页。保留单元格内容、合并关系和列宽比例；字号与行高自动适配。预览中的纸张与 PDF 使用同一版式。</small><canvas id="preview" width="1190" height="1684" aria-label="采购入库单签字预览"></canvas></section></main><script src="vendor/xlsx.full.min.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="receipt-sign.js?v=6"></script></body></html>
