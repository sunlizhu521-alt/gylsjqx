<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采购入库单签字｜供应链数据清洗</title><link rel="stylesheet" href="styles-merge14.css"><style>main{max-width:1280px;margin:30px auto;padding:20px}section{background:var(--surface,#fff);padding:24px;border:1px solid #d9dee7;border-radius:14px;margin:18px 0}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center}label{display:flex;flex-direction:column;gap:8px}button,input,select{font:inherit}button{padding:10px 18px;cursor:pointer}#preview{display:block;width:100%;height:auto;background:white;cursor:crosshair;border:1px solid #ccd3df}#signaturePreview{max-width:180px;max-height:80px;background:white}#status{white-space:pre-wrap;line-height:1.8}small{display:block;line-height:1.7;color:#5b6679}button:disabled{cursor:not-allowed;opacity:.5}</style></head><body><main><a href="index.html">← 返回工具箱</a><h1>采购入库单签字</h1><p>上传采购入库单和签名图片，在空白处签字后下载 PDF。原文件不修改，文件与签名仅在当前浏览器内处理。</p><section><div class="controls"><label>采购入库单（可多选）<input id="file" type="file" multiple accept=".xls,.xlsx"></label><label>签名图片<input id="signature" type="file" accept="image/png,image/jpeg,image/webp"></label><label>查看工作表<select id="sheet" disabled></select></label><label>签名宽度（毫米）<input id="signatureWidth" type="number" min="15" max="70" value="35"></label></div><p><label style="display:inline-flex;flex-direction:row"><input id="cleanSignature" type="checkbox" checked>提取白底图片中的签名（去除白底和外围黑边）</label></p><small id="signatureMemory">首次上传后自动保存在当前浏览器，下次无需重复选择。</small><button id="clearSignature" type="button">清除已保存签名</button><img id="signaturePreview" alt="签名预览" hidden><small>请检查提取后的笔迹是否完整；如图片已有透明背景或提取效果不合适，可取消勾选。签名默认放在表格下方空白处，点击纸张空白位置可移动，位置按工作表分别保存。</small><p id="status" role="status">请上传采购入库单和签名图片。</p><button id="download" disabled>下载签字 PDF</button></section><section><small>A4 竖向，按上传文件及工作表顺序合并为一个 PDF，每个工作表一页。保留单元格内容、合并关系和列宽比例；字号与行高自动适配。预览中的纸张与 PDF 使用同一版式。</small><canvas id="preview" width="1190" height="1684" aria-label="采购入库单签字预览"></canvas></section></main><script src="vendor/xlsx.full.min.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="receipt-sign.js?v=3"></script></body></html>
