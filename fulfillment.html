<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单履约表整理｜供应链数据清洗</title><link rel="stylesheet" href="styles-merge14.css"><style>main{max-width:1400px;margin:40px auto;padding:24px}section{background:var(--surface,#fff);border:1px solid #dde3ea;border-radius:16px;padding:24px;margin:20px 0}h1{margin-bottom:12px}p{line-height:1.8}input{margin:16px 0}button{padding:12px 24px;cursor:pointer;border:0;border-radius:10px;background:#315b9d;color:white;font-weight:600;margin-top:16px}button:disabled{opacity:.45;cursor:not-allowed}input::file-selector-button{padding:10px 16px;border:1px solid #cbd5e1;border-radius:8px;background:white;cursor:pointer;margin-right:12px}#preview{overflow:auto;max-height:520px}table{border-collapse:collapse;width:max-content}th,td{border:1px solid #d9dee7;padding:4px 8px;font-size:11pt;line-height:20px;text-align:center;white-space:nowrap}th{background:#315b9d;color:white;font-weight:700;position:sticky;top:0}td{background:white;color:#182333}#warnings{white-space:pre-wrap;max-height:220px;overflow:auto;color:#9a4b00}a{color:#315b9d}#status{white-space:pre-wrap}</style></head><body><main><a href="index.html">← 返回工具箱</a><h1>订单履约表整理</h1><p>合并徐英、李奇、操思敏、邢芳芳、孙立柱工作表，按指定顺序保留 20 列。文件仅在浏览器内处理。</p><section><label for="file">上传订单履约 Excel 文件</label><br><input id="file" type="file" accept=".xlsx,.xls"><p>逐行保留，不去重、不汇总数量。日期显示为“2026年8月14日”；空白和“/”保留。</p><div id="status" role="status" aria-live="polite">等待上传</div><div id="warnings"></div><button id="download" disabled>下载汇总表</button></section><section id="result" hidden><h2>合并预览</h2><p id="count"></p><div id="preview"></div></section></main><script src="vendor/xlsx.full.min.js"></script><script src="vendor/jszip.min.js"></script><script src="fulfillment-core.js?v=3"></script><script src="fulfillment-tool.js?v=6"></script></body></html>
